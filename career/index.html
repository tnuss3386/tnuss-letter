<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TNUSS CareerPort</title>
  <meta name="theme-color" content="#0b3a2f">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CareerPort">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { --tint: #0b3a2f; --accent: #9ebba5; --warm: #feede0; --bg: #f4f5f7; --surface: #fff; --label: #191919; --label-2: #565b63; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
    @media (prefers-color-scheme: dark) { :root { --bg: #14181d; --surface: #1d2229; --label: #f2f3f5; --label-2: #a7adb6; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; background: var(--bg); color: var(--label); -webkit-text-size-adjust: 100%; }
    .wrap { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(32px + var(--safe-top)) 24px calc(32px + var(--safe-bottom)); max-width: 420px; margin: 0 auto; }
    .crest { width: 96px; height: auto; margin-bottom: 18px; }
    h1 { margin: 0 0 8px; font-size: 2rem; line-height: 1.2; font-weight: 800; color: var(--tint); white-space: nowrap; }
    @media (prefers-color-scheme: dark) { h1 { color: var(--accent); } }
    h1 .w1 { font-weight: 600; color: var(--label-2); margin-right: .25em; }
    .tagline { margin: 0 0 2px; font-size: 1rem; font-weight: 600; }
    .sub { margin: 0 0 36px; color: var(--label-2); font-size: .85rem; letter-spacing: .04em; }
    .btn { display: block; width: 100%; padding: 16px 24px; border-radius: 14px; background: var(--tint); color: #fff; font-size: 1.1rem; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) { .btn { background: #1f6a56; } }
    .btn:active { filter: brightness(1.15); }
    .note { margin: 18px 0 0; color: var(--label-2); font-size: .82rem; line-height: 1.7; }
  </style>
</head>
<body>
  <main class="wrap" id="view">
    <img class="crest" src="icons/crest.png" alt="" width="96">
    <h1 id="title"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="sub" id="school"></p>
    <a class="btn" id="open" href="#" target="_blank" rel="noopener">CareerPort を開く</a>
    <p class="note">学校のGoogleアカウントでログインします。<br>ログインできないときは、学校へお問い合わせください。</p>
  </main>
  <script src="config.js"></script>
  <script>
    (function () {
      function set(id, text) { var el = document.getElementById(id); if (el) el.textContent = text || ''; }
      var t = (typeof APP_TITLE !== 'undefined' && APP_TITLE) || 'CareerPort', i = t.indexOf(' ');
      var h = document.getElementById('title');
      if (i > 0) { var a = document.createElement('span'); a.className = 'w1'; a.textContent = t.slice(0, i); h.appendChild(a); h.appendChild(document.createTextNode(t.slice(i + 1))); }
      else h.textContent = t;
      set('tagline', typeof APP_TAGLINE !== 'undefined' ? APP_TAGLINE : '');
      set('school', typeof SCHOOL_NAME !== 'undefined' ? SCHOOL_NAME : '');
      var link = document.getElementById('open');
      var url = typeof CAREERPORT_URL === 'string' ? CAREERPORT_URL : '';
      if (/^https:\/\/script\.google\.com\//.test(url)) link.href = url;
      else { link.removeAttribute('href'); link.textContent = '設定が未完了です（config.js の CAREERPORT_URL）'; }
      if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    })();
  </script>
</body>
</html>
